<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>AI Computer Agent</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="title-bar-drag"></div>
  <div class="sidebar">
    <!-- Profile Section in Sidebar -->
    <div class="profile-section">
      <div class="profile-pic-sidebar"></div> <!-- Placeholder for user image -->
      <div class="profile-info">
        <h3>User</h3>
        <p>Online</p>
      </div>
    </div>

    <!-- Navigation -->
    <!-- Navigation Top -->
    <nav class="nav-menu">
      <button class="nav-item active" data-target="chat-view">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
        Chat
      </button>
      <button class="nav-item" data-target="task-view">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
        </svg>
        Task Agent
      </button>
    </nav>

    <!-- Navigation Bottom (Profile/Settings) -->
    <nav class="nav-menu" style="margin-top: auto;">
      <button class="nav-item" data-target="profile-view">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        Profile
      </button>
      <button class="nav-item" data-target="settings-view">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
          </path>
        </svg>
        Settings
      </button>
    </nav>
  </div>

  <div class="main-content">
    <!-- API Gate (Overlay) -->
    <div id="api-gate" class="api-gate-content"
      style="position: absolute; inset: 0; background: var(--bg-primary); z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <div
        style="width: 100%; max-width: 400px; padding: 40px; background: var(--bg-secondary); border-radius: 20px; border: 1px solid var(--border-color); text-align: center;">
        <div style="font-size: 40px; margin-bottom: 20px;">🔐</div>
        <h2 style="margin-bottom: 10px;">Authenticate</h2>
        <p style="color: var(--text-secondary); margin-bottom: 30px; font-size: 0.9rem;">Enter Gemini API Key to
          connect.</p>
        <input type="password" id="apiKeyInput" placeholder="sk-..." style="width: 100%; margin-bottom: 20px;">
        <button id="saveKeyBtn" style="width: 100%;">Connect</button>
        <p id="error" style="color: var(--error); margin-top: 15px; font-size: 0.9rem; min-height: 20px;"></p>
      </div>
    </div>

    <!-- VIEWS -->
    <!-- VIEW 1: CHAT (Pure AI Chat) -->
    <div id="chat-view" class="view active">
      <!-- Chat Header (New) -->
      <div style="padding: 10px 24px; display: flex; justify-content: flex-end; align-items: center;">
        <button id="newChatBtn" class="icon-btn non-draggable" title="New Chat"
          style="width: 40px; height: 40px; background: transparent; border: 1px solid var(--border-color);">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14"></path>
          </svg>
        </button>
      </div>

      <div id="chat-messages" class="chat-container"></div>
      <div class="input-area">
        <button class="icon-btn upload-btn" id="chatUploadBtn" title="Upload File to Chat">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <input type="file" id="chatFileUpload" style="display: none;" accept=".txt,.md,.json,.js,.csv,.pdf">
        </button>
        <input type="text" id="chatInput" placeholder="Ask me anything..." autocomplete="off">
        <button id="sendChatBtn" class="icon-btn send-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>

    <!-- VIEW 2: TASK (Agent Control) -->
    <div id="task-view" class="view">
      <div id="task-messages" class="chat-container"></div>

      <!-- Granular Status Line -->
      <div id="agent-status-line" class="agent-status hidden">
        <span class="spinner">⟳</span>
        <span id="status-text">Initializing...</span>
      </div>

      <div class="input-area">
        <button class="icon-btn upload-btn" title="Upload Document">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="17 8 12 3 7 8"></polyline>
            <line x1="12" y1="3" x2="12" y2="15"></line>
          </svg>
          <input type="file" id="fileUpload" style="display: none;" accept=".txt,.md,.json,.js,.csv">
        </button>

        <input type="text" id="taskInput" placeholder="Give me a task to execute..." autocomplete="off">

        <button id="runBtn" class="icon-btn send-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>

        <!-- Stop Button -->
        <button id="stopBtn" class="icon-btn stop-btn hidden" title="Stop Task">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          </svg>
        </button>
      </div>
    </div>

    <div id="profile-view" class="view" style="padding: 40px;">
      <h1>Profile</h1>
      <div class="profile-card" style="align-items: center; flex-direction: row; text-align: left;">

        <!-- Photo on Left/Center (User asked for Left/Middle - sticking to Flex Row) -->
        <div style="position: relative; flex-shrink: 0;">
          <div id="profile-pic-preview" class="profile-pic-large"></div>
          <button id="changePhotoBtn"
            style="position: absolute; bottom: 10px; right: 10px; background: var(--accent-color); border-radius: 50%; width: 40px; height: 40px; padding: 0; display: flex; align-items: center; justify-content: center; border: 2px solid #1e293b; cursor: pointer;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
              <circle cx="12" cy="13" r="4"></circle>
            </svg>
          </button>
          <input type="file" id="profilePhotoInput" accept="image/*" style="display: none;">
        </div>

        <!-- Info on Right -->
        <div class="settings-group" style="flex: 1; margin-top: 0;">
          <label>Display Name</label>
          <input type="text" id="profileName" class="profile-input-lg" placeholder="Enter Name" value="User">

          <label style="margin-top: 20px;">Date of Birth</label>
          <input type="date" id="profileDob" class="profile-input-lg" style="font-size: 1.1rem;">

          <button id="saveProfileBtn"
            style="margin-top: 25px; width: auto; padding: 12px 30px; background: var(--accent-color); border: none; border-radius: 8px; color: white; cursor: pointer;">Save
            Changes</button>
        </div>

      </div>
    </div>

    <div id="settings-view" class="view" style="padding: 40px;">
      <h1>Settings</h1>
      <div class="settings-group">
        <label>Telegram Bot Token</label>
        <input type="password" id="telegramTokenInput" placeholder="123456:ABCDEF...">

        <label style="margin-top: 16px;">Telegram Admin ID</label>
        <input type="text" id="telegramAdminInput" placeholder="123456789">

        <button id="saveTelegramBtn" style="margin-top: 12px;">Save Telegram Settings</button>

        <hr style="margin: 24px 0; border: 1px solid var(--border-color);">

        <label>Theme Color</label>
        <div class="theme-options">
          <!-- Midnight Blue (Default) -->
          <div class="theme-swatch active" style="background: linear-gradient(135deg, #1e3a8a, #3b82f6);"
            data-color="#1e40af" data-hover="#1e3a8a" data-grad="linear-gradient(135deg, #1e3a8a, #3b82f6)"
            data-tint="rgba(15, 23, 42, 0.8)"></div>

          <!-- Muted Plum -->
          <div class="theme-swatch" style="background: linear-gradient(135deg, #581c87, #7e22ce);" data-color="#6b21a8"
            data-hover="#581c87" data-grad="linear-gradient(135deg, #581c87, #7e22ce)"
            data-tint="rgba(30, 20, 40, 0.8)"></div>

          <!-- Forest -->
          <div class="theme-swatch" style="background: linear-gradient(135deg, #064e3b, #059669);" data-color="#047857"
            data-hover="#064e3b" data-grad="linear-gradient(135deg, #064e3b, #059669)"
            data-tint="rgba(10, 30, 20, 0.8)"></div>

          <!-- Coffee / Brown (New) -->
          <div class="theme-swatch" style="background: linear-gradient(135deg, #451a03, #78350f);" data-color="#854d0e"
            data-hover="#713f12" data-grad="linear-gradient(135deg, #451a03, #92400e)"
            data-tint="rgba(40, 20, 10, 0.8)"></div>

          <!-- Charcoal (Neutral) -->
          <div class="theme-swatch" style="background: linear-gradient(135deg, #3f3f46, #71717a);" data-color="#525252"
            data-hover="#404040" data-grad="linear-gradient(135deg, #262626, #525252)"
            data-tint="rgba(24, 24, 27, 0.85)"></div>
        </div>
      </div>
      <div class="settings-group">
        <label>Gemini API Key</label>
        <div style="display: flex; gap: 10px;">
          <input type="text" id="settingsApiKey" placeholder="sk-..." style="width: 100%; font-family: monospace;">
          <button id="updateKeyBtn" class="secondary-btn">Update</button>
        </div>
        <p style="font-size: 0.8rem; color: var(--text-secondary); margin-top: 5px;">Key is stored securely locally.</p>
      </div>
    </div>

    <!-- Cropper Modal -->
    <div id="cropper-modal" class="hidden"
      style="position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: flex; align-items: center; justify-content: center;">
      <div style="background: var(--bg-secondary); padding: 20px; border-radius: 16px; width: 400px;">
        <h3 style="margin-bottom: 20px; text-align: center;">Edit Photo</h3>

        <!-- Crop Area -->
        <div
          style="position: relative; width: 300px; height: 300px; margin: 0 auto; overflow: hidden; border-radius: 50%; border: 4px solid var(--accent-color);">
          <canvas id="crop-canvas" width="300" height="300" style="cursor: move;"></canvas>
        </div>

        <!-- Controls -->
        <div style="margin-top: 20px; display: flex; align-items: center; gap: 10px;">
          <span style="font-size: 0.8rem;">Zoom</span>
          <input type="range" id="zoom-slider" min="1" max="3" step="0.1" value="1" style="flex: 1;">
        </div>

        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
          <button id="cancelCropBtn" class="secondary-btn">Cancel</button>
          <button id="saveCropBtn" class="secondary-btn"
            style="background: var(--accent-color); border: none;">Save</button>
        </div>
      </div>
    </div>

  </div> <!-- End Main Content -->

  <script src="renderer.js"></script>
</body>

</html>
